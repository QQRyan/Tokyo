<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的東京行程地圖</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg-canvas: #f4f5f7;
            --surface: #ffffff;
            --ink-deep: #1e293b;
            --ink-soft: #64748b;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--ink-deep);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左側行程面板 */
        .sidebar {
            width: 450px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }

        /* 頂部天數導航列 */
        .day-nav {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            padding: 8px;
            gap: 4px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .day-nav-btn {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .day-nav-btn:hover {
            background: var(--border);
            color: var(--ink-deep);
        }

        .day-nav-btn.active {
            background: var(--primary);
            color: white;
        }

        .day-nav-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* 每日區塊 */
        .day-panel {
            padding: 20px;
            border-bottom: 8px solid var(--bg-canvas);
            display: none;
        }

        .day-panel.active {
            display: block;
        }

        .day-head {
            margin-bottom: 16px;
        }

        .day-head h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--ink-deep);
            margin-bottom: 4px;
        }

        .day-head .date {
            font-size: 13px;
            color: var(--ink-soft);
        }

        /* 順路 Flow */
        .flow-box {
            background: var(--primary-light);
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #1e40af;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .flow-tag {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            border: 1px solid #93c5fd;
            cursor: pointer;
        }

        .flow-tag:hover {
            background: var(--primary);
            color: white;
        }

        /* 景點卡片清單 */
        .spot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .spot-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .spot-card.highlight {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .spot-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .spot-cat {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-canvas);
            color: var(--ink-soft);
        }

        .spot-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
        }

        .spot-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .spot-addr {
            font-size: 12px;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .spot-brief {
            font-size: 13px;
            color: var(--ink-deep);
            background: var(--bg-canvas);
            padding: 6px 8px;
            border-radius: 6px;
        }

        /* 右側地圖 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 響應式微調 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50vh;
            }
            #map {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🗼 我的東京行程規劃</h1>
        <div class="controls">
            <select id="areaFilter">
                <option value="ALL">全部區域</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <!-- 左側行程 -->
        <div class="sidebar">
            <nav class="day-nav" id="dayNav"></nav>
            <div id="itineraryContainer"></div>
        </div>
        <!-- 右側地圖 -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // 初始化地圖
        const map = L.map('map').setView([35.6762, 139.6503], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let allData = [];
        let markersMap = {}; 

        // 【新增】智慧縮減長名稱邏輯：自動過濾丁目並合併，使 Day 底下的導航和標題清爽
        function getShortAreaName(areaStr) {
            if (!areaStr) return '';
            let parts = areaStr.split(/➔|->/).map(s => s.trim());
            let cleanedParts = parts.map(p => {
                return p.replace(/\s*\d+丁目?/g, '').trim();
            });
            let uniqueParts = [...new Set(cleanedParts.filter(Boolean))];
            if (uniqueParts.length > 2) {
                return `${uniqueParts[0]} ➔ ${uniqueParts[1]} 等`;
            }
            return uniqueParts.join(' ➔ ') || areaStr;
        }

        // 讀取 CSV 檔案
        fetch('locations.csv')
            .then(response => {
                if (!response.ok) throw new Error('找不到 locations.csv 檔案');
                return response.text();
            })
            .then(csvText => {
                parseCSVData(csvText);
            })
            .catch(error => {
                console.error(error);
                alert('載入 CSV 失敗：' + error.message);
            });

        function parseCSVData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const headers = parseCSVLine(lines[0]);
            
            let rawItems = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVLine(lines[i]);
                let item = {};
                headers.forEach((h, idx) => {
                    item[h.trim()] = row[idx] ? row[idx].trim() : '';
                });
                rawItems.push(item);
            }

            let daysMap = {};
            rawItems.forEach(item => {
                let dayKey = item.day || 'Day 1';
                if (!daysMap[dayKey]) {
                    daysMap[dayKey] = {
                        dayNo: dayKey,
                        date: item.date || '',
                        area: item.dayArea || '',
                        routeFlow: item.routeFlow || '',
                        spots: []
                    };
                }
                daysMap[dayKey].spots.push(item);
            });

            allData = Object.values(daysMap);
            buildUI();
            populateAreaFilter();
            renderAllOnMap();
        }

        function parseCSVLine(text) {
            let result = [];
            let insideQuote = false;
            let currentStr = '';
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    insideQuote = !insideQuote;
                } else if (c === ',' && !insideQuote) {
                    result.push(currentStr);
                    currentStr = '';
                } else {
                    currentStr += c;
                }
            }
            result.push(currentStr);
            return result.map(s => s.replace(/^"|"$/g, '').trim());
        }

        function buildUI() {
            const dayNav = document.getElementById('dayNav');
            const container = document.getElementById('itineraryContainer');
            dayNav.innerHTML = '';
            container.innerHTML = '';

            allData.forEach((d, index) => {
                const shortArea = getShortAreaName(d.area);

                // 建立頂部導航鈕（套用短名稱）
                const navBtn = document.createElement('button');
                navBtn.className = `day-nav-btn ${index === 0 ? 'active' : ''}`;
                navBtn.innerHTML = `<span class="day-no">${d.dayNo}</span><span class="dot"></span><span class="area">${shortArea}</span>`;
                navBtn.onclick = () => switchDay(index);
                dayNav.appendChild(navBtn);

                const panel = document.createElement('div');
                panel.className = `day-panel ${index === 0 ? 'active' : ''}`;
                panel.id = `day-panel-${index}`;

                let flowHTML = '';
                if (d.routeFlow) {
                    let flowItems = d.routeFlow.split(/➔|->/).map(s => `<span class="flow-tag">${s.trim()}</span>`).join(' ➔ ');
                    flowHTML = `<div class="flow-box"><strong>順路：</strong> ${flowItems}</div>`;
                }

                let spotsHTML = '';
                d.spots.forEach((s, sIdx) => {
                    let spotId = `spot-${index}-${sIdx}`;
                    spotsHTML += `
                        <div class="spot-card" id="${spotId}" onclick="focusSpot('${s.lat}', '${s.lng}', '${spotId}')">
                            <div class="spot-header">
                                <span class="spot-cat">${s.cat || '景點'}</span>
                                <span class="spot-time">${s.time || ''}</span>
                            </div>
                            <div class="spot-name">${s.name || ''}</div>
                            <div class="spot-addr">📍 ${s.addr || s.area || ''}</div>
                            ${s.brief ? `<div class="spot-brief">${s.brief}</div>` : ''}
                        </div>
                    `;
                });

                panel.innerHTML = `
                    <div class="day-head">
                        <h2>${shortArea}</h2>
                        <span class="date">${d.dayNo} ・ ${d.date}</span>
                    </div>
                    ${flowHTML}
                    <div class="spot-list">${spotsHTML}</div>
                `;
                container.appendChild(panel);
            });
        }

        function switchDay(index) {
            document.querySelectorAll('.day-nav-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
            document.querySelectorAll('.day-panel').forEach((panel, idx) => {
                panel.classList.toggle('active', idx === index);
            });

            let targetDay = allData[index];
            if (targetDay && targetDay.spots.length > 0) {
                let firstValid = targetDay.spots.find(s => s.lat && s.lng);
                if (firstValid) {
                    map.setView([parseFloat(firstValid.lat), parseFloat(firstValid.lng)], 14);
                }
            }
        }

        function populateAreaFilter() {
            const filterSelect = document.getElementById('areaFilter');
            let areas = new Set();
            allData.forEach(d => {
                d.spots.forEach(s => {
                    if (s.area) areas.add(s.area);
                });
            });

            areas.forEach(area => {
                let opt = document.createElement('option');
                opt.value = area;
                opt.textContent = area;
                filterSelect.appendChild(opt);
            });

            filterSelect.onchange = (e) => {
                let val = e.target.value;
                filterByArea(val);
            };
        }

        function filterByArea(selectedArea) {
            markersLayer.clearLayers();
            markersMap = {};

            allData.forEach((d, dIdx) => {
                d.spots.forEach((s, sIdx) => {
                    if (selectedArea === 'ALL' || s.area === selectedArea) {
                        if (s.lat && s.lng) {
                            let lat = parseFloat(s.lat);
                            let lng = parseFloat(s.lng);
                            let marker = L.marker([lat, lng]).addTo(markersLayer);
                            marker.bindPopup(`<b>${s.name}</b><br>${s.addr || s.area}<br><span style="color:var(--primary);">${s.time || ''}</span>`);
                            
                            let spotId = `spot-${dIdx}-${sIdx}`;
                            markersMap[spotId] = marker;

                            marker.on('click', () => {
                                highlightSpotCard(spotId);
                            });
                        }
                    }
                });
            });
        }

        function renderAllOnMap() {
            filterByArea('ALL');
        }

        function focusSpot(lat, lng, spotId) {
            if (!lat || !lng || isNaN(lat) || isNaN(lng)) return;
            map.setView([parseFloat(lat), parseFloat(lng)], 16);
            
            highlightSpotCard(spotId);

            if (markersMap[spotId]) {
                markersMap[spotId].openPopup();
            }
        }

        function highlightSpotCard(spotId) {
            document.querySelectorAll('.spot-card').forEach(card => card.classList.remove('highlight'));
            let targetCard = document.getElementById(spotId);
            if (targetCard) {
                targetCard.classList.add('highlight');
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    </script>
</body>
</html>
